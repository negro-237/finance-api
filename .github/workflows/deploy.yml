name: Déployer l’API en production

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: finance-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Déployer via SSH
        shell: bash
        env:
          DEPLOY_PATH: /home/admin/web/finance.negro-services.com/public_html
          DEPLOY_REPOSITORY: https://github.com/negro-237/finance-api.git
          SSH_HOST: 180.149.199.229
          SSH_PORT: '5804'
          SSH_USER: admin
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          : "${SSH_PRIVATE_KEY:?Le secret SSH_PRIVATE_KEY est requis}"
          : "${SSH_KNOWN_HOSTS:?Le secret SSH_KNOWN_HOSTS est requis}"

          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"

          ssh -p "$SSH_PORT" -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            "$SSH_USER@$SSH_HOST" "bash -se -- '$DEPLOY_PATH' '$DEPLOY_REPOSITORY'" <<'DEPLOY'
          cd "$1"
          if [ "$(git branch --show-current)" != main ]; then
            echo "Le dépôt de production doit être sur la branche main." >&2
            exit 1
          fi
          npm_global_prefix="$(npm prefix -g)"
          export PATH="$PATH:$npm_global_prefix/bin:$HOME/.local/bin"
          if ! command -v pm2 >/dev/null 2>&1; then
            echo "PM2 est introuvable dans la session SSH de $USER." >&2
            exit 1
          fi

          GIT_TERMINAL_PROMPT=0 git pull --ff-only "$2" main
          npm ci --include=dev
          npx prisma generate
          npm run build
          test -f dist/src/main.js
          npx prisma migrate deploy

          # Arrêter l’instance lancée par l’ancien workflow avant de passer à PM2.
          pid_file="$HOME/.local/state/finance-api/server.pid"
          entrypoint="$PWD/dist/src/main.js"

          is_api_process() {
            local pid="$1"
            local -a args=()
            [[ "$pid" =~ ^[1-9][0-9]*$ ]] &&
              mapfile -d '' -t args 2>/dev/null < "/proc/$pid/cmdline" &&
              [[ "${args[0]}" == node && "${args[1]}" == "$entrypoint" ]]
          }

          if [ -f "$pid_file" ] && read -r old_pid < "$pid_file" && is_api_process "$old_pid"; then
            kill -TERM "$old_pid"
            for ((attempt=0; attempt<15; attempt++)); do
              is_api_process "$old_pid" || break
              sleep 1
            done
            if is_api_process "$old_pid"; then
              echo "L’ancienne instance de l’API ne s’est pas arrêtée (PID $old_pid)." >&2
              exit 1
            fi
          fi
          rm -f -- "$pid_file"

          if pm2 describe finance-api >/dev/null 2>&1; then
            pm2 restart finance-api --update-env
          else
            pm2 start "$entrypoint" --name finance-api --cwd "$PWD"
          fi

          # Vérifier que NestJS répond sur le port configuré.
          if ! node -r dotenv/config <<'CHECK_API'
          const { setTimeout: delay } = require('node:timers/promises');
          const port = Number(process.env.PORT ?? 3000);

          async function checkApi() {
            for (let attempt = 0; attempt < 30; attempt++) {
              const response = await fetch(`http://127.0.0.1:${port}/docs/`, {
                signal: AbortSignal.timeout(1000),
              }).catch(() => null);
              if (response?.ok) return;
              await delay(1000);
            }
            process.exitCode = 1;
          }

          checkApi();
          CHECK_API
          then
            echo 'L’API ne répond pas. Consultez pm2 logs finance-api sur le serveur.' >&2
            exit 1
          fi
          echo 'L’API répond sous PM2.'
          DEPLOY
